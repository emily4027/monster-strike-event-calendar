<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怪物彈珠活動行事曆</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-decoration"></div>

    <div class="container main-container">
        <header class="app-header text-center">
            <div class="icon-badge mx-auto mb-3">📅</div>
            <h1>怪物彈珠活動行事曆</h1>

            <div id="cloudStatus" class="cloud-status">
                <span class="status-dot"></span>
                <span id="cloudStatusText">讀取活動清單中...</span>
            </div>

            <div id="auth-container" class="mt-2">
                <button type="button" id="google-login-btn" class="auth-btn login">
                    <i class="bi bi-google"></i> 登入 Google 帳號以顯示雲端抽卡紀錄
                </button>
                <div id="user-info" style="display: none;">
                    <img id="user-avatar" alt="" class="rounded-circle" width="30" height="30">
                    <span id="user-display-name" class="fw-bold"></span>
                    <button type="button" id="logout-btn" class="btn btn-sm btn-outline-secondary">登出</button>
                </div>
            </div>
        </header>

        <div class="section-card">
            <!-- 月份切換與篩選 -->
            <div class="calendar-toolbar">
                <div class="month-nav">
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="prev-month" aria-label="上個月"><i class="bi bi-chevron-left"></i></button>
                    <h2 id="month-title" class="month-title"></h2>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="next-month" aria-label="下個月"><i class="bi bi-chevron-right"></i></button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="today-btn">今天</button>
                </div>
                <div class="toolbar-filters">
                    <label for="account-filter" class="visually-hidden">帳號</label>
                    <select id="account-filter" class="form-select form-select-sm" disabled>
                        <option value="all">全部帳號</option>
                    </select>
                </div>
            </div>

            <div class="tag-legend" aria-label="標籤顏色">
                <span class="legend-item"><span class="legend-dot tag-honke"></span>本家</span>
                <span class="legend-item"><span class="legend-dot tag-collab"></span>合作</span>
                <span class="legend-item"><span class="legend-dot tag-free"></span>免費</span>
                <span class="legend-item"><span class="legend-dot tag-orb"></span>寶珠</span>
                <span id="records-source" class="records-source"></span>
            </div>

            <!-- 桌機：月曆格 -->
            <div class="calendar-grid" id="calendar-grid">
                <div class="weekday-row">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div id="calendar-weeks"></div>
            </div>

            <!-- 手機：依日期排列的清單 -->
            <ul class="event-list" id="event-list"></ul>
        </div>
    </div>

    <!-- 活動詳細 -->
    <div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="event-modal-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="event-modal-title"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
                </div>
                <div class="modal-body" id="event-modal-body"></div>
            </div>
        </div>
    </div>

    <!-- 懸浮工具箱菜單 (工具連結會改用工具箱 tools.js 的清單；讀不到時使用下面的連結) -->
    <div class="toolbox-menu-wrapper" title="滑鼠懸停以展開菜單">
        <div class="toolbox-items-list">
            <a href="https://emily4027.github.io/monster-strike-toolbox/" class="toolbox-item toolbox-home">
                <i class="bi bi-house-fill"></i> 工具箱首頁
            </a>
            <a href="https://emily4027.github.io/monster-strike-fruit-assign/" class="toolbox-item">
                <i class="bi bi-apple"></i> 果實分配
            </a>
            <a href="https://emily4027.github.io/monster-strike-gacha/" class="toolbox-item">
                <i class="bi bi-bar-chart-line-fill"></i> 抽卡統計
            </a>
            <a href="https://emily4027.github.io/monster-strike-event-calendar/" class="toolbox-item active">
                <i class="bi bi-calendar-event"></i> 活動行事曆 (現行)
            </a>
        </div>
        <button type="button" class="toolbox-main-btn">
            <i class="bi bi-tools"></i> 工具箱
        </button>
    </div>

    <a href="https://github.com/emily4027/monster-strike-event-calendar" target="_blank" rel="noopener" class="github-project-link" title="前往 GitHub 專案頁面">
        <i class="bi bi-github"></i> GitHub
    </a>

    <div id="toast-message"></div>

    <!-- Firebase SDK (和其他工具同一個專案；這個頁面只讀取，不寫入) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAjpfcNC4ZniqIxYzgYwp5Cs_8gbbmflVY",
            authDomain: "ms-toolbox-web.firebaseapp.com",
            projectId: "ms-toolbox-web",
            storageBucket: "ms-toolbox-web.firebasestorage.app",
            messagingSenderId: "777818785736",
            appId: "1:777818785736:web:880b878f4a510132dfe2fd",
            measurementId: "G-7KV0FSL1RG"
        };

        const app = initializeApp(firebaseConfig);
        window.firebaseAuth = getAuth(app);
        window.db = getFirestore(app);
        window.envAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        window.firebaseFns = { GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, doc, getDoc };
    </script>

    <script src="calendar.js" defer></script>
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
