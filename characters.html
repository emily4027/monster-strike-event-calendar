<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轉蛋資料庫 - 角色</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/characters.css">
</head>
<body>
    <div class="bg-decoration"></div>

    <div class="container main-container">
        <header class="app-header text-center">
            <div class="icon-badge mx-auto mb-3">🗂️</div>
            <h1>怪物彈珠轉蛋資料庫</h1>
            <p class="app-subtitle">抽卡統計的附屬工具：轉蛋活動行事曆、卡池與抽到的角色</p>

            <div id="cloudStatus" class="cloud-status">
                <span id="statusDot" class="status-dot"></span>
                <span id="cloudStatusText">連線中...</span>
            </div>

            <div id="auth-container" class="mt-2">
                <button type="button" id="google-login-btn" class="auth-btn login">
                    <i class="bi bi-google"></i> 登入 Google 帳號以讀取雲端紀錄
                </button>
                <div id="user-info" hidden>
                    <img id="user-avatar" alt="" class="rounded-circle" width="30" height="30" hidden>
                    <span id="user-display-name" class="fw-bold"></span>
                    <span id="admin-badge" class="admin-badge" hidden>管理員</span>
                    <button type="button" id="logout-btn" class="btn btn-sm btn-outline-secondary">登出</button>
                </div>
            </div>
        </header>

        <nav class="page-tabs" aria-label="頁面">
            <a href="./" class="page-tab">📅 行事曆</a>
            <a href="characters.html" class="page-tab active" aria-current="page">📖 角色</a>
        </nav>

        <p class="page-intro">整理所有帳號在抽卡統計裡抽到的角色（只讀取，不會修改抽卡紀錄）。</p>

        <!-- 資料來源提示 -->
        <div id="source-notice" class="source-notice" hidden></div>

        <!-- 篩選 -->
        <div class="section-card">
            <div class="filter-grid">
                <div>
                    <label for="search-input" class="form-label">搜尋角色</label>
                    <input type="search" id="search-input" class="form-control" placeholder="輸入角色名稱" autocomplete="off">
                </div>
                <div>
                    <label for="account-filter" class="form-label">帳號</label>
                    <select id="account-filter" class="form-select">
                        <option value="">全部帳號合計</option>
                    </select>
                </div>
                <div>
                    <label for="sort-select" class="form-label">排序</label>
                    <select id="sort-select" class="form-select">
                        <option value="recent">最近抽到</option>
                        <option value="count">數量多到少</option>
                        <option value="name">名稱</option>
                    </select>
                </div>
                <div>
                    <label for="pool-filter" class="form-label">卡池</label>
                    <select id="pool-filter" class="form-select">
                        <option value="">全部角色</option>
                        <option value="limited">所有限定角色</option>
                        <option value="collab">合作角色</option>
                        <option value="none">常駐角色</option>
                    </select>
                </div>
                <div>
                    <span class="form-label d-block">活動類型</span>
                    <div class="tag-filter-group" id="tag-filter-group">
                        <input type="checkbox" class="btn-check tag-filter" id="tag-filter-honke" value="honke" autocomplete="off">
                        <label class="btn btn-sm tag-btn tag-honke" for="tag-filter-honke">本家</label>
                        <input type="checkbox" class="btn-check tag-filter" id="tag-filter-collab" value="collab" autocomplete="off">
                        <label class="btn btn-sm tag-btn tag-collab" for="tag-filter-collab">合作</label>
                        <input type="checkbox" class="btn-check tag-filter" id="tag-filter-free" value="free" autocomplete="off">
                        <label class="btn btn-sm tag-btn tag-free" for="tag-filter-free">免費</label>
                    </div>
                </div>
            </div>
            <p id="summary" class="summary"></p>
        </div>

        <!-- 角色列表 -->
        <div class="section-card mt-4">
            <div id="catalog-list" class="catalog-list"></div>
            <p id="empty-message" class="empty-message" hidden></p>
        </div>

        <footer class="site-footer">
            <p>本網站為非官方的粉絲製作工具，與遊戲官方無關。活動與卡池資料整理自<a href="https://www.monster-strike.com.tw/news/" target="_blank" rel="noopener">台版官網公告</a>與<a href="https://www.monster-strike.com.tw/tips/20260609_ch.html" target="_blank" rel="noopener">限定角色名單大檢閱</a>。</p>
            <p>《怪物彈珠》（モンスターストライク）相關名稱、角色與商標之著作權均屬 &copy; mixi 及各權利人所有。</p>
        </footer>
    </div>

    <!-- 懸浮工具箱菜單 (工具連結會改用工具箱 tools.js 的清單；讀不到時使用下面的連結) -->
    <div class="toolbox-menu-wrapper" title="滑鼠懸停以展開菜單">
        <div class="toolbox-items-list">
            <a href="https://emily4027.github.io/monster-strike-toolbox/" class="toolbox-item toolbox-home">
                <i class="bi bi-house-fill"></i> 工具箱首頁
            </a>
            <a href="https://emily4027.github.io/monster-strike-fruit-assign/" class="toolbox-item">
                <i class="bi bi-apple"></i> 果實分配
            </a>
            <a href="https://emily4027.github.io/monster-strike-gacha/" class="toolbox-item">
                <i class="bi bi-bar-chart-line-fill"></i> 抽卡統計
            </a>
            <a href="https://emily4027.github.io/monster-strike-gacha-data/" class="toolbox-item active">
                <i class="bi bi-archive-fill"></i> 轉蛋資料庫 (現行)
            </a>
        </div>
        <button type="button" class="toolbox-main-btn">
            <i class="bi bi-tools"></i> 工具箱
        </button>
    </div>

    <a href="https://github.com/emily4027/monster-strike-gacha-data" target="_blank" rel="noopener" class="github-project-link" title="前往 GitHub 專案頁面">
        <i class="bi bi-github"></i> GitHub
    </a>

    <script type="module" src="js/firebase.js"></script>
    <script src="pools.js" defer></script>
    <script src="js/catalog.js" defer></script>
    <script src="js/common.js" defer></script>
    <script src="js/characters-page.js" defer></script>
</body>
</html>
